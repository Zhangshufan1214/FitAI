<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitAI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0c0f;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    background: #0b0c0f;
    padding-bottom: 90px;
}

.page {
    display: none;
    padding: 24px 18px;
}

.page.active {
    display: block;
}

.title {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 6px;
}

.subtitle {
    color: #8f939c;
    font-size: 14px;
}

.card {
    background: #15171c;
    border: 1px solid #292c33;
    border-radius: 22px;
    padding: 18px;
    margin-top: 16px;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    height: 76px;
    background: rgba(18,20,24,0.96);
    border-top: 1px solid #292c33;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.nav-button {
    border: none;
    background: none;
    color: #777b84;
    font-size: 11px;
}

.nav-button span {
    display: block;
    font-size: 22px;
    margin-bottom: 4px;
}

.nav-button.active {
    color: #d8ff3f;
}
</style>
</head>

<body>

<div class="app">

    <div id="home" class="page active">
        <div class="title">今天怎么练？</div>
        <div class="subtitle">AI 私人健身教练</div>

        <div class="card">
            <h2>今日训练</h2>
            <p class="subtitle">胸 + 三头 · 约 50 分钟</p>
        </div>
    </div>

    <div id="train" class="page">
        <div class="title">训练</div>
        <div class="subtitle">开始你的训练</div>
    </div>

    <div id="equipment" class="page">
        <div class="title">器械库</div>
        <div class="subtitle">管理你的健身房</div>
    </div>

    <div id="ai" class="page">
        <div class="title">AI 教练</div>
        <div class="subtitle">你的私人训练顾问</div>
    </div>

    <div id="data" class="page">
        <div class="title">数据</div>
        <div class="subtitle">记录你的长期进步</div>
    </div>

    <div class="bottom-nav">

        <button class="nav-button active" onclick="showPage('home', this)">
            <span>⌂</span>
            首页
        </button>

        <button class="nav-button" onclick="showPage('train', this)">
            <span>◎</span>
            训练
        </button>

        <button class="nav-button" onclick="showPage('equipment', this)">
            <span>▣</span>
            器械
        </button>

        <button class="nav-button" onclick="showPage('ai', this)">
            <span>✦</span>
            AI
        </button>

        <button class="nav-button" onclick="showPage('data', this)">
            <span>↗</span>
            数据
        </button>

    </div>

</div>

<script>

function showPage(pageId, button) {

    document.querySelectorAll(".page").forEach(function(page) {
        page.classList.remove("active");
    });

    document.getElementById(pageId).classList.add("active");

    document.querySelectorAll(".nav-button").forEach(function(btn) {
        btn.classList.remove("active");
    });

    button.classList.add("active");
}

</script>

</body>
</html>
